[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bmaglass-sdk"
version = "1.0.0"
description = "Python client for the BMaGlass Pay Developer API"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[tool.setuptools.packages.find]
include = ["bmaglass_sdk*"]
