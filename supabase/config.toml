verify_jwt = true

# Delta-audit E6: explicit on purpose — the p2p function verifies
# user JWTs itself and the cron path authenticates with the
# service-key bearer (isCronCall), so the gateway check stays ON,
# matching production intent.
[functions.p2p]
verify_jwt = true

# Payoneer payouts (brief §2): payouts is called by a signed-in
# admin (JWT on); the webhook is called by Payoneer itself and
# authenticates with the shared-secret HMAC header instead.
[functions.payoneer-payouts]
verify_jwt = true

[functions.payoneer-webhook]
verify_jwt = false

