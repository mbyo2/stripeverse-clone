# Delta-audit E6: explicit on purpose — the p2p function verifies
# user JWTs itself and the cron path authenticates with the
# service-key bearer (isCronCall), so the gateway check stays ON,
# matching production intent.
[functions.p2p]
verify_jwt = true

[functions.mastercard-move]
verify_jwt = true

[functions.mastercard-processing]
verify_jwt = true

# MoonPay card on-ramp: session + admin are called by signed-in
# users/admins (JWT on); the webhook is called by MoonPay itself and
# authenticates with the Moonpay-Signature-V2 HMAC header instead.
# Reconcile is scheduler-only (pg_cron with the service-role key —
# a valid JWT, so the gateway check stays on; the function itself
# then refuses user JWTs with 403).
[functions.moonpay-session]
verify_jwt = true

[functions.moonpay-reconcile]
verify_jwt = true

[functions.moonpay-admin]
verify_jwt = true

[functions.paypal-admin]
verify_jwt = true

[functions.bank-payout]
verify_jwt = true

[functions.moonpay-webhook]
verify_jwt = false
